name: Build packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./...
      - name: Install build-only packager
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: Build EXE and Debian packages
        run: node scripts/release.mjs 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: certplum-0.1.0
          path: dist/*
